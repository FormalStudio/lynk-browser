[package]
name = "lynk-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.95"

[lib]
name = "lynk_core"

[dependencies]
nd-settings = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2.3"
url = "2"
percent-encoding = "2"
regex = "1"

[dev-dependencies]
tempfile = "3"
